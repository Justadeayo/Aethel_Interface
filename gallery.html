    <title>Aethel | Mission Archive</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .img-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .img-placeholder {
            background: #161f2e; height: 180px; border-radius: var(--radius-sm);
            border: 1px solid var(--border-subtle); display: flex; align-items: center; justify-content: center;
            color: var(--gold-accent); font-size: 12px; letter-spacing: 2px;
            transition: all var(--trans-fast); overflow: hidden;
        }
        .img-placeholder:hover { transform: scale(1.03); border-color: var(--gold-shine); box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
    </style>
</head>

    <main class="page-container">
        <h2>Mission Archive</h2>
        <div class="img-grid">
            <div class="img-placeholder">SECTOR 01</div>
            <div class="img-placeholder">SECTOR 02</div>
            <div class="img-placeholder">SECTOR 03</div>
        </div>
